<dialog id="match-dialog" aria-labelledby="match-name">
<div class="match-dialog-header"><h2 id="match-name"></h2><button type="button" id="match-close" aria-label="Close card details">✕</button></div>
<p id="match-position" role="status" hidden></p>
<div class="match-carousel">
<button type="button" id="match-prev" class="match-arrow" aria-label="Previous match" hidden>‹</button>
<div class="match-content" id="match-swipe"><div><img id="match-image" alt="" hidden><p id="match-image-set"></p></div><div>
<p id="match-store"></p><p id="match-price"></p><p id="match-set"></p>
<p id="match-status" role="status"></p><p id="match-oracle"></p>
<button type="button" id="match-retry" hidden>Retry card details</button>
<a id="match-store-link" target="_blank" rel="noopener">View at store ↗</a>
</div></div>
<button type="button" id="match-next" class="match-arrow" aria-label="Next match" hidden>›</button>
</div>
</dialog>
