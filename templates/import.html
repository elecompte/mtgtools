{% extends "base.html" %}
{% block title %}Portals card lookup{% endblock %}
{% block page %}portal-page portals-theme{% endblock %}
{% block nav %}<a href="/watchlist">Watchlist</a>{% endblock %}
{% block styles %}<link rel="stylesheet" href="/static/css/portals-theme.css">{% endblock %}
{% block content %}
<main class="portal"><header><img src="/static/img/portalsbanner.png" alt="Portals Card Lookup"></header><div class="search-columns">
        <div class="section tan">
            <form id="importForm" enctype="multipart/form-data" method="POST">
                <div class="input-group">
                    <h2>Search by name</h2>
<label for="cardNames">Card names · one per line, searched in batches of 50</label>
<textarea id="cardNames" name="cardNames" rows="5" placeholder="Sol Ring&#10;Arcane Signet"></textarea>
<label for="fileInput">Or use a text file</label><input type="file" id="fileInput" name="file" accept=".txt">
<button type="submit">Find in stores</button>
                </div>
            </form>
            <div role="status" id="importStatus"></div>
        </div>
        <div class="section tan">
            <form id="scryfallForm">
                <div class="input-group">
                    <h2>Scryfall search</h2><label for="scryfallQuery">Search by card properties</label>
                    <input type="text" id="scryfallQuery" name="scryfallQuery" placeholder="e.g. t:dragon cmc<=3 o:haste" autocomplete="off">
                    <button type="submit" class="scryfall-button">Search Scryfall</button>
                    <div role="status" id="scryfallStatus" class="status-text"></div>
                </div>
            </form>
        </div>
    </div>
    </main><div id="loadingOverlay">
        <div class="loader"></div>
        <div role="status" class="loading-text">Loading, please wait...</div>
    </div>
    <script>
    var overlay = document.getElementById('loadingOverlay');
    var overlayText = overlay.querySelector('.loading-text');

    document.getElementById('importForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        var status = document.getElementById('importStatus');
        status.textContent = '';

        var fileInput = document.getElementById('fileInput');
        var textValue = document.getElementById('cardNames').value || '';
        var file = fileInput.files && fileInput.files[0];
        var content = '';

        if (file) {
            try {
                content = await readFile(file);
            } catch (err) {
                content = '';
            }
        } else {
            content = textValue;
        }

        var names = extractNames(content);
        if (!names.length) {
            status.textContent = 'Enter card names or upload a file.';
            return;
        }
        startImport(names, status);
    });

    document.getElementById('scryfallForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        var status = document.getElementById('scryfallStatus');
        var query = document.getElementById('scryfallQuery').value.trim();
        status.textContent = '';

        if (!query) {
            status.textContent = 'Enter a Scryfall search query.';
            return;
        }

        status.textContent = 'Searching Scryfall...';
        try {
            var resp = await fetch('/scryfall_batch', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({query: query})
            });
            var data = await resp.json();
            if (!resp.ok) {
                status.textContent = data.error || 'Scryfall search failed.';
                return;
            }
            var entries = (data.entries || []).map(function(card) {
                return {name: card.name, set: card.set, exact: true};
            }).filter(function(card) { return card.name; });
            if (!entries.length) {
                status.textContent = 'No results found.';
                return;
            }
            status.textContent = data.next_count ? 'Showing the first 50 cards from Scryfall.' : '';
            document.getElementById('cardNames').value = entries.map(function(card) {
                return card.name;
            }).join('\n');
            startImport(entries, status, {
                query: query,
                cursor: data.next_cursor,
                next_count: data.next_count
            });
        } catch (err) {
            status.textContent = 'Scryfall search failed.';
        }
    });

    function readFile(file) {
        return new Promise(function(resolve, reject) {
            var reader = new FileReader();
            reader.onload = function(evt) { resolve(evt.target.result || ''); };
            reader.onerror = function(err) { reject(err); };
            reader.readAsText(file);
        });
    }

    function extractNames(content) {
        return content.split(/\r?\n/).map(function(line) {
            var trimmed = line.trim();
            if (!trimmed) {
                return '';
            }
            var parts = trimmed.split(' ');
            if (parts.length > 1 && /^\d+$/.test(parts[0])) {
                return trimmed.substring(parts[0].length + 1).trim();
            }
            return trimmed;
        }).filter(Boolean);
    }

    async function startImport(names, statusEl, scryfallMeta) {
        overlayText.textContent = 'Searching for cards: 0 of ' + names.length;
        overlay.classList.add('active');

        try {
            var resp = await fetch('/import_job', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({cardNames: names, scryfall: scryfallMeta || null})
            });
            var data = await resp.json();
            if (!resp.ok) {
                overlay.classList.remove('active');
                if (statusEl) {
                    statusEl.textContent = data.error || 'Import failed.';
                }
                return;
            }
            window.location.href = '/import_job/' + data.job_id + '/results';
        } catch (err) {
            overlay.classList.remove('active');
            if (statusEl) {
                statusEl.textContent = 'Import failed.';
            }
        }
    }

    </script>
{% endblock %}
