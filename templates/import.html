<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/css/tiles.css">
    <link rel="stylesheet" href="/static/css/import.css">
    <link rel="stylesheet" href="/static/css/subpage.css">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#1976d2">
    <link rel="icon" href="/static/img/mtg.ico">
    <link rel="apple-touch-icon" href="/static/img/mtg.png">
</head>
<body>
    <a href="/" class="back-arrow" aria-label="Back to main page">&#8592;</a>
    <div class="import-banner-container">
        <img src="/static/img/portalsbanner.png" alt="Portals Card Lookup Banner" class="import-banner">
    </div>
    <div class="container" style="margin-top:0;">
        <div class="section tan" style="margin-top:0;">
            <form id="importForm" enctype="multipart/form-data" method="POST">
                <div class="input-group">
                    <input type="file" id="fileInput" name="file" accept=".txt" style="margin-bottom:10px;">
                    <div style="margin:10px 0; color:#333; font-weight:bold;">OR</div>
                    <textarea id="cardNames" name="cardNames" rows="6" cols="40" placeholder="Paste card names here, one per line"></textarea>
                    <button type="submit" style="margin-top:15px;">Import</button>
                </div>
            </form>
            <div id="importStatus" style="margin-top:20px; color:#2196F3;"></div>
        </div>
        <div class="section tan">
            <form id="scryfallForm">
                <div class="input-group">
                    <div class="input-label">Scryfall Search</div>
                    <input type="text" id="scryfallQuery" name="scryfallQuery" placeholder="e.g. t:dragon cmc<=3 o:haste" autocomplete="off">
                    <button type="submit" class="scryfall-button">Search Scryfall</button>
                    <div id="scryfallStatus" class="status-text"></div>
                </div>
            </form>
        </div>
    </div>
    <div id="loadingOverlay">
        <div class="loader"></div>
        <div class="loading-text">Loading, please wait...</div>
    </div>
    <script>
    var overlay = document.getElementById('loadingOverlay');
    var overlayText = overlay.querySelector('.loading-text');

    document.getElementById('importForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        var status = document.getElementById('importStatus');
        status.textContent = '';

        var fileInput = document.getElementById('fileInput');
        var textValue = document.getElementById('cardNames').value || '';
        var file = fileInput.files && fileInput.files[0];
        var content = '';

        if (file) {
            try {
                content = await readFile(file);
            } catch (err) {
                content = '';
            }
        } else {
            content = textValue;
        }

        var names = extractNames(content);
        if (!names.length) {
            status.textContent = 'Enter card names or upload a file.';
            return;
        }
        if (names.length > 50) {
            names = names.slice(0, 50);
        }
        startImport(names, status);
    });

    document.getElementById('scryfallForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        var status = document.getElementById('scryfallStatus');
        var query = document.getElementById('scryfallQuery').value.trim();
        status.textContent = '';

        if (!query) {
            status.textContent = 'Enter a Scryfall search query.';
            return;
        }

        status.textContent = 'Searching Scryfall...';
        try {
            var resp = await fetch('/scryfall_batch', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({query: query})
            });
            var data = await resp.json();
            if (!resp.ok) {
                status.textContent = data.error || 'Scryfall search failed.';
                return;
            }
            var entries = (data.entries || []).map(function(card) {
                return {name: card.name, set: card.set, exact: true};
            }).filter(function(card) { return card.name; });
            if (!entries.length) {
                status.textContent = 'No results found.';
                return;
            }
            status.textContent = data.next_count ? 'Showing the first 50 cards from Scryfall.' : '';
            document.getElementById('cardNames').value = entries.map(function(card) {
                return card.name;
            }).join('\n');
            startImport(entries, status, {
                query: query,
                cursor: data.next_cursor,
                next_count: data.next_count
            });
        } catch (err) {
            status.textContent = 'Scryfall search failed.';
        }
    });

    function readFile(file) {
        return new Promise(function(resolve, reject) {
            var reader = new FileReader();
            reader.onload = function(evt) { resolve(evt.target.result || ''); };
            reader.onerror = function(err) { reject(err); };
            reader.readAsText(file);
        });
    }

    function extractNames(content) {
        return content.split(/\r?\n/).map(function(line) {
            var trimmed = line.trim();
            if (!trimmed) {
                return '';
            }
            var parts = trimmed.split(' ');
            if (parts.length > 1 && /^\d+$/.test(parts[0])) {
                return trimmed.substring(parts[0].length + 1).trim();
            }
            return trimmed;
        }).filter(Boolean);
    }

    async function startImport(names, statusEl, scryfallMeta) {
        overlayText.textContent = 'Searching for cards: 0 of ' + names.length;
        overlay.classList.add('active');

        try {
            var resp = await fetch('/import_job', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({cardNames: names, scryfall: scryfallMeta || null})
            });
            var data = await resp.json();
            if (!resp.ok) {
                overlay.classList.remove('active');
                if (statusEl) {
                    statusEl.textContent = data.error || 'Import failed.';
                }
                return;
            }
            pollImportProgress(data.job_id, data.total, statusEl);
        } catch (err) {
            overlay.classList.remove('active');
            if (statusEl) {
                statusEl.textContent = 'Import failed.';
            }
        }
    }

    function pollImportProgress(jobId, total, statusEl) {
        var interval = setInterval(async function() {
            try {
                var resp = await fetch('/import_job/' + jobId + '/progress');
                var data = await resp.json();
                if (!resp.ok) {
                    throw new Error(data.error || 'Import failed.');
                }
                var current = data.current || 0;
                overlayText.textContent = 'Searching for cards: ' + current + ' of ' + (total || data.total || 0);
                if (data.status === 'done') {
                    clearInterval(interval);
                    window.location.href = '/import_job/' + jobId + '/results';
                }
            } catch (err) {
                clearInterval(interval);
                overlay.classList.remove('active');
                if (statusEl) {
                    statusEl.textContent = 'Import failed.';
                }
            }
        }, 600);
    }
    </script>
</body>
</html>
