{% extends "base.html" %}
{% block title %}Devilish Valet Tracker{% endblock %}
{% block page %}tool{% endblock %}
{% block styles %}<link rel="stylesheet" href="/static/css/valet.css">{% endblock %}
{% block nav %}<a href="?overlay=1">OBS overlay ↗</a>{% endblock %}
{% block content %}

    <div class="valet-container">
        <div class="valet-card">
            <div class="valet-header">
                <span class="valet-title">Devilish Valet Power</span>
                <span class="valet-subtitle">Doubles on each creature ETB</span>
            </div>
            <div class="valet-power-controls">
                <button type="button" class="valet-power-btn" aria-label="Decrease power" id="power-minus">-</button>
                <div class="valet-display" id="valet-power">1</div>
                <button type="button" class="valet-power-btn" aria-label="Increase power" id="power-plus">+</button>
            </div>
            <div class="valet-controls">
                <button type="button" class="valet-btn minus" aria-label="Remove creature ETB" id="etb-minus">-</button>
                <div class="etb-meta">
                    <span class="etb-label">Creature ETBs</span>
                    <span class="etb-count" id="etb-count">0</span>
                </div>
                <button type="button" class="valet-btn plus" aria-label="Add creature ETB" id="etb-plus">+</button>
            </div>
        </div>
    </div>
    <script>
        const state = {
            power: 1,
            etbs: 0,
        };

        const powerEl = document.getElementById('valet-power');
        const etbCountEl = document.getElementById('etb-count');

        const updateDisplay = () => {
            powerEl.textContent = state.power.toLocaleString();
            etbCountEl.textContent = state.etbs;
        };

        document.getElementById('etb-plus').addEventListener('click', () => {
            state.etbs += 1;
            state.power = state.power * 2;
            updateDisplay();
        });

        document.getElementById('etb-minus').addEventListener('click', () => {
            if (state.etbs <= 0) return;
            state.etbs -= 1;
            state.power = Math.max(1, Math.floor(state.power / 2));
            updateDisplay();
        });

        document.getElementById('power-plus').addEventListener('click', () => {
            state.power += 1;
            updateDisplay();
        });

        document.getElementById('power-minus').addEventListener('click', () => {
            state.power = Math.max(1, state.power - 1);
            updateDisplay();
        });


        window.restoreObsState = values => {
            if ('valet-power' in values) state.power = Number(String(values['valet-power']).replace(/[^0-9.e+]/gi, ''));
            if ('etb-count' in values) state.etbs = Number(String(values['etb-count']).replace(/[^0-9.e+]/gi, ''));
            updateDisplay();
        };
    </script>
{% endblock %}
